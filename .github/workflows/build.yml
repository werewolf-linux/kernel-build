name: build
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      inputs_artifact:
        type: string
        default: ''
      production:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    concurrency:
      group: native-build-${{ github.event_name }}-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.production && 'release' || 'ci' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y bubblewrap gnupg make openssl xz-utils
          python3 scripts/install-melange.py --dest build/tools/melange
          sudo python3 scripts/setup-runner.py
      - name: Check sandbox chroot before building
        run: |
          sudo "$PWD/build/tools/bwrap" --ro-bind / / --dev /dev --proc /proc --unshare-pid \
              --cap-add CAP_SYS_CHROOT -- /usr/bin/python3 -c 'import os; os.chroot("/")'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.inputs_artifact != ''
        with:
          name: ${{ inputs.inputs_artifact }}
          path: build/inputs
      - name: Capture the latest kernel.org release for standalone validation
        if: inputs.inputs_artifact == ''
        run: python3 scripts/refresh.py
      - name: Check the lists, configs and tools
        run: make check verify
      - name: Write production signing key
        if: inputs.production
        env:
          KERNEL_APK_SIGNING_KEY: ${{ secrets.WEREWOLF_PACKAGES_KEY }}
        run: |
          test -n "$KERNEL_APK_SIGNING_KEY"
          python3 scripts/signing-key.py
      - name: Build, sign and boot the kernel
        run: |
          set -o pipefail
          sudo env PATH="$PWD/build/tools:$PATH" make ARCH=${{ matrix.arch }} build 2>&1 | tee build/build.log
      - name: Record the build that passed
        run: |
          sudo chown -R "$USER" build
          python3 scripts/provenance.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linux-werewolf-${{ matrix.arch }}
          path: build/packages/
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: log-${{ matrix.arch }}
          path: build/build.log
          if-no-files-found: warn
