name: publish the latest kernel.org release
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
# A newer run, from a commit or the schedule, cancels an older one's builds: they would
# be of outdated inputs. A publish that has begun always finishes, one at a time.
jobs:
  discover:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      # Finding a resumable draft release needs push access.
      contents: write
      # GitHub stops a public repository's schedule after 60 days without commits.
      actions: write
    outputs:
      state: ${{ steps.check.outputs.state }}
    steps:
      - name: Keep the hourly schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/refresh.yml/enable"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/refresh.py
      - run: make check verify
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.check.outputs.state != 'complete'
        with:
          name: kernel-inputs
          path: build/inputs/kernel.lock.json
          if-no-files-found: error
  build:
    needs: discover
    concurrency:
      group: kernel-build-${{ github.ref }}
      cancel-in-progress: true
    if: needs.discover.outputs.state == 'build'
    uses: ./.github/workflows/build.yml
    with:
      inputs_artifact: kernel-inputs
      production: true
    secrets: inherit
  publish:
    needs: [discover, build]
    concurrency:
      group: kernel-publish
      cancel-in-progress: false
    if: >-
      always() && !cancelled() && needs.discover.result == 'success' &&
      (needs.build.result == 'success' || needs.discover.outputs.state == 'publish')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kernel-inputs
          path: build/inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.result == 'success'
        with:
          pattern: linux-werewolf-*
          path: artifacts
      - name: Stage a resumable draft from both native builds
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py stage
      - name: Write production signing key for the stable index
        env:
          KERNEL_APK_SIGNING_KEY: ${{ secrets.WEREWOLF_PACKAGES_KEY }}
        run: |
          test -n "$KERNEL_APK_SIGNING_KEY"
          python3 scripts/signing-key.py
      - name: Publish signed APK repositories and complete the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          python3 scripts/publish.py publish
