# Options on for aarch64 only. See common.cfg.

## A generic ACPI or device-tree virtual machine: QEMU virt, Lima VZ,
## Graviton, Cobalt, Axion
## bhyve exposes legacy virtio PCI disks, network and RNG on arm64 too.
CONFIG_VIRTIO_PCI_LEGACY=y
CONFIG_ARM64_VA_BITS_48=y
CONFIG_ARM64_4K_PAGES=y
CONFIG_PCI_HOST_GENERIC=y
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
CONFIG_SERIAL_OF_PLATFORM=y
CONFIG_GPIOLIB=y
CONFIG_GPIO_PL061=y
CONFIG_INPUT_KEYBOARD=y
CONFIG_KEYBOARD_GPIO=y
CONFIG_RTC_DRV_PL031=y
CONFIG_RTC_DRV_EFI=y
CONFIG_ARM_PSCI_CPUIDLE=y
CONFIG_HOTPLUG_CPU=y
CONFIG_ARM64_CONTPTE=y
CONFIG_ARM64_HAFT=y
CONFIG_ARM64_TLB_RANGE=y
# dm-crypt (LUKS2 aes-xts) at hardware speed.
CONFIG_CRYPTO_AES_ARM64_CE_BLK=y

## The qemu-host form's nested virtualization; kvm-arm.mode=none elsewhere
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=y

## Hardware protections
CONFIG_ARM64_PTR_AUTH=y
CONFIG_ARM64_PTR_AUTH_KERNEL=y
# Kernel BTI needs Clang < 21 in 7.2 (llvm-project#215547); kCFI covers forward edges.
CONFIG_ARM64_BTI=y
CONFIG_ARM64_MTE=y
CONFIG_ARM64_GCS=y
CONFIG_ARM64_POE=y
CONFIG_ARM64_LSUI=y
CONFIG_ARM64_E0PD=y
CONFIG_ARM64_EPAN=y
CONFIG_ARM64_SW_TTBR0_PAN=y
CONFIG_ARM64_TAGGED_ADDR_ABI=y
CONFIG_ARM64_SVE=y
CONFIG_ARM64_HW_AFDBM=y
CONFIG_ARM64_CNP=y
CONFIG_ARM64_RAS_EXTN=y
CONFIG_SHADOW_CALL_STACK=y
CONFIG_UNMAP_KERNEL_AT_EL0=y
CONFIG_MITIGATE_SPECTRE_BRANCH_HISTORY=y
CONFIG_STACKPROTECTOR_PER_TASK=y
CONFIG_ARCH_MMAP_RND_BITS=33

## Errata of Arm-designed and Ampere cores, any host. Each workaround runs only
## on the CPU it names; a missing one is silent corruption there.
