# Options that must stay off whatever the lists say or kconfig selects.
# Each closes a route an exploit has used, or an interface werewolf refuses.
# config.py check fails the build if any of these is on.

# Loading code into the running kernel
# CONFIG_MODULES is not set
# CONFIG_KEXEC_CORE is not set
# CONFIG_LIVEPATCH is not set
# CONFIG_BPF_SYSCALL is not set
# CONFIG_KPROBES is not set
# CONFIG_FTRACE is not set
# CONFIG_DEBUG_FS is not set

# Interfaces behind recent privilege escalations
# CONFIG_IO_URING is not set
# CONFIG_USER_NS is not set
# CONFIG_NETFILTER is not set
# CONFIG_USERFAULTFD is not set
# CONFIG_CRYPTO_USER_API is not set
# CONFIG_TLS is not set
# CONFIG_WATCH_QUEUE is not set
# CONFIG_OVERLAY_FS is not set
# CONFIG_NET_CLS_ACT is not set

# Old ABIs and raw access
# CONFIG_COMPAT is not set
# CONFIG_IA32_EMULATION is not set
# CONFIG_X86_X32_ABI is not set
# CONFIG_MODIFY_LDT_SYSCALL is not set
# CONFIG_X86_VSYSCALL_EMULATION is not set
# CONFIG_X86_IOPL_IOPERM is not set
# CONFIG_DEVMEM is not set
# CONFIG_DEVPORT is not set
# CONFIG_PROC_KCORE is not set
# CONFIG_LEGACY_TIOCSTI is not set
# CONFIG_LDISC_AUTOLOAD is not set
# CONFIG_MAGIC_SYSRQ is not set
# CONFIG_BINFMT_MISC is not set
# CONFIG_UEVENT_HELPER is not set

# Weakened enforcement
# CONFIG_CFI_PERMISSIVE is not set
# CONFIG_SECURITY_SELINUX_DEVELOP is not set
# CONFIG_IPE_POLICY_SIG_SECONDARY_KEYRING is not set
# CONFIG_IPE_POLICY_SIG_PLATFORM_KEYRING is not set
# CONFIG_SECONDARY_TRUSTED_KEYRING is not set
# CONFIG_LOCK_DOWN_KERNEL_FORCE_NONE is not set
# CONFIG_INIT_STACK_NONE is not set
