# Options on for x86_64 only. See common.cfg.

## A KVM, Hyper-V or bhyve guest
# bhyve exposes legacy virtio PCI disks, network and RNG.
CONFIG_VIRTIO_PCI_LEGACY=y
CONFIG_HYPERVISOR_GUEST=y
CONFIG_PARAVIRT=y
CONFIG_PARAVIRT_SPINLOCKS=y
CONFIG_PARAVIRT_TIME_ACCOUNTING=y
CONFIG_KVM_GUEST=y
CONFIG_HALTPOLL_CPUIDLE=y
CONFIG_RSEQ_SLICE_EXTENSION=y
CONFIG_HYPERV_TIMER=y
CONFIG_CPU_SUP_INTEL=y
CONFIG_CPU_SUP_AMD=y
CONFIG_X86_X2APIC=y
# PCIe extended configuration space: q35, Nitro and Hyper-V devices.
CONFIG_PCI_MMCONFIG=y
CONFIG_RTC_DRV_CMOS=y
CONFIG_X86_PM_TIMER=y
CONFIG_X86_MCE=y
CONFIG_X86_MCE_INTEL=y
CONFIG_X86_MCE_AMD=y
CONFIG_MTRR=y
CONFIG_X86_PAT=y
CONFIG_X86_UMIP=y
CONFIG_X86_64_ACPI_NUMA=y
CONFIG_HOTPLUG_CPU=y
CONFIG_KERNEL_ZSTD=y
CONFIG_EFI_DXE_MEM_ATTRIBUTES=y
# dm-crypt (LUKS2 aes-xts) at hardware speed.
CONFIG_CRYPTO_AES_NI_INTEL=y

## The qemu-host form's nested virtualization; init unlinks /dev/kvm elsewhere
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=y
CONFIG_KVM_INTEL=y
CONFIG_KVM_AMD=y

## Hardware protections and every speculation mitigation
CONFIG_X86_FRED=y
CONFIG_X86_KERNEL_IBT=y
# Upstream's default. Without modules, FineIBT's __apply_fineibt runs only at boot, but
# modpost still flags its calls into .init.text (text_poke_early, poison_endbr) and,
# strict, stops the link. arm64 stays strict.
CONFIG_SECTION_MISMATCH_WARN_ONLY=y
# No user shadow stacks yet: glibc refuses to dlopen an unmarked library under them, and
# Java's libjvm.so and some Python/PHP extension dependencies are unmarked.
CONFIG_X86_INTEL_TSX_MODE_OFF=y
CONFIG_X86_INTEL_MEMORY_PROTECTION_KEYS=y
CONFIG_RANDOMIZE_MEMORY=y
CONFIG_LEGACY_VSYSCALL_NONE=y
CONFIG_MITIGATION_PAGE_TABLE_ISOLATION=y
CONFIG_MITIGATION_RETPOLINE=y
CONFIG_MITIGATION_RETHUNK=y
CONFIG_MITIGATION_UNRET_ENTRY=y
CONFIG_MITIGATION_CALL_DEPTH_TRACKING=y
CONFIG_MITIGATION_IBPB_ENTRY=y
CONFIG_MITIGATION_IBRS_ENTRY=y
CONFIG_MITIGATION_SRSO=y
CONFIG_MITIGATION_SLS=y
CONFIG_MITIGATION_GDS=y
CONFIG_MITIGATION_RFDS=y
CONFIG_MITIGATION_SPECTRE_BHI=y
CONFIG_MITIGATION_MDS=y
CONFIG_MITIGATION_TAA=y
CONFIG_MITIGATION_MMIO_STALE_DATA=y
CONFIG_MITIGATION_L1TF=y
CONFIG_MITIGATION_RETBLEED=y
CONFIG_MITIGATION_SPECTRE_V1=y
CONFIG_MITIGATION_SPECTRE_V2=y
CONFIG_MITIGATION_SRBDS=y
CONFIG_MITIGATION_SSB=y
CONFIG_MITIGATION_ITS=y
CONFIG_MITIGATION_TSA=y
CONFIG_MITIGATION_VMSCAPE=y
CONFIG_ARCH_MMAP_RND_BITS=32
CONFIG_UNWINDER_ORC=y
